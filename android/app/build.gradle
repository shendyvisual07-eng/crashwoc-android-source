import java.util.zip.ZipFile

plugins {
    id "com.android.application"
}

def sdlVersion = "3.4.16"
def sdlArchive = layout.buildDirectory.file("downloads/SDL3-devel-${sdlVersion}-android.zip")
def sdlAar = layout.projectDirectory.file("libs/SDL3.aar")

tasks.register("prepareSDL3Aar") {
    outputs.file(sdlAar)
    doLast {
        def archive = sdlArchive.get().asFile
        if (!archive.exists() || archive.length() == 0L) {
            archive.parentFile.mkdirs()
            def downloadUrl = "https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/SDL3-devel-${sdlVersion}-android.zip"
            // GitHub release downloads can intermittently return 502/504 in hosted CI.
            // Retry transient network failures and fail only after all attempts are exhausted.
            def result = providers.exec {
                commandLine "curl", "--fail", "--location", "--retry", "5",
                    "--retry-all-errors", "--retry-delay", "5",
                    "--connect-timeout", "30", "--max-time", "600",
                    "--output", archive.absolutePath, downloadUrl
                ignoreExitValue = true
            }
            if (result.result.get().exitValue != 0 || !archive.exists() || archive.length() == 0L) {
                archive.delete()
                throw new GradleException("Failed to download SDL3 Android archive after retries: ${downloadUrl}")
            }
        }
        ZipFile zip = new ZipFile(archive)
        try {
            def entry = zip.entries().find { !it.directory && it.name.toLowerCase(Locale.ROOT).endsWith(".aar") }
            if (entry == null) {
                throw new GradleException("The SDL3 Android archive did not contain an AAR")
            }
            sdlAar.asFile.parentFile.mkdirs()
            zip.getInputStream(entry).withCloseable { input ->
                sdlAar.asFile.withOutputStream { output -> output << input }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named("preBuild").configure { dependsOn("prepareSDL3Aar") }

android {
    namespace "com.shendyvisual.crashwoc"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.shendyvisual.crashwoc"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0-android-preview"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DNUWORLD_SYSTEM_SDL3=ON", "-DNUWORLD_DECOMP=ON", "-DNUWORLD_TESTS=OFF"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.30.3"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "src/main/AndroidManifest.xml"
        }
    }
}

dependencies {
    implementation files("libs/SDL3.aar")
}
