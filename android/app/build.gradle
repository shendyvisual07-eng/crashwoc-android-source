import java.util.zip.ZipFile

plugins {
    id "com.android.application"
}

def sdlVersion = "3.4.16"
def sdlArchive = layout.buildDirectory.file("downloads/SDL3-devel-${sdlVersion}-android.zip")
def sdlAar = layout.projectDirectory.file("libs/SDL3.aar")

tasks.register("prepareSDL3Aar") {
    outputs.file(sdlAar)
    doLast {
        def archive = sdlArchive.get().asFile
        if (!archive.exists() || archive.length() == 0L) {
            archive.parentFile.mkdirs()
            def releaseUrl = "https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/SDL3-devel-${sdlVersion}-android.zip"
            // GitHub release CDN can intermittently return 502/504 in hosted CI.
            // Try the browser URL first, then GitHub's release-asset API endpoint.
            def downloadAttempts = [
                [url: releaseUrl, headers: []],
                [url: "https://api.github.com/repos/libsdl-org/SDL/releases/assets/541452351",
                 headers: ["-H", "Accept: application/octet-stream", "-H", "X-GitHub-Api-Version: 2022-11-28"]]
            ]
            def downloaded = false
            def errors = []
            downloadAttempts.each { attempt ->
                if (!downloaded) {
                    archive.delete()
                    def args = ["curl", "--fail", "--show-error", "--location",
                        "--retry", "5", "--retry-all-errors", "--retry-delay", "5",
                        "--connect-timeout", "30", "--max-time", "600"]
                    args.addAll(attempt.headers)
                    args.addAll(["--output", archive.absolutePath, attempt.url])
                    def result = providers.exec {
                        commandLine args
                        ignoreExitValue = true
                    }
                    downloaded = result.result.get().exitValue == 0 &&
                        archive.exists() && archive.length() > 1000000L
                    if (!downloaded) {
                        errors.add(attempt.url)
                    }
                }
            }
            if (!downloaded) {
                archive.delete()
                throw new GradleException("Failed to download SDL3 Android archive from all sources: ${errors.join(', ')}")
            }
        }
        ZipFile zip = new ZipFile(archive)
        try {
            def entry = zip.entries().find { !it.directory && it.name.toLowerCase(Locale.ROOT).endsWith(".aar") }
            if (entry == null) {
                throw new GradleException("The SDL3 Android archive did not contain an AAR")
            }
            sdlAar.asFile.parentFile.mkdirs()
            zip.getInputStream(entry).withCloseable { input ->
                sdlAar.asFile.withOutputStream { output -> output << input }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named("preBuild").configure { dependsOn("prepareSDL3Aar") }

android {
    namespace "com.shendyvisual.crashwoc"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.shendyvisual.crashwoc"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0-android-preview"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DNUWORLD_SYSTEM_SDL3=ON", "-DNUWORLD_DECOMP=ON", "-DNUWORLD_TESTS=OFF"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.30.3"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "src/main/AndroidManifest.xml"
        }
    }
}

dependencies {
    implementation files("libs/SDL3.aar")
}
