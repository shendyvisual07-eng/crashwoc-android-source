name: Android preview

on:
  push:
    branches: [ "android/port-foundation" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-arm64-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install decomp generator dependencies
        run: python -m pip install -r tools/requirements.txt
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.30.3"
      - name: Install verified Gradle 8.9 distribution
        env:
          GRADLE_SHA256: d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
        run: |
          set -euo pipefail
          archive=/tmp/gradle-8.9-bin.zip
          rm -f "$archive"

          # Prefer the Huawei mirror because the official distribution host
          # repeatedly returned HTTP 504 from the GitHub-hosted runner.
          if ! curl --fail --location --retry 3 --retry-all-errors --retry-delay 4 \
              --connect-timeout 30 --max-time 900 \
              https://repo.huaweicloud.com/gradle/gradle-8.9-bin.zip \
              --output "$archive"; then
            rm -f "$archive"
            echo "Huawei mirror failed; trying the official Gradle host once more."
            curl --fail --location --retry 2 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 900 \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip \
              --output "$archive"
          fi

          echo "$GRADLE_SHA256  $archive" | sha256sum --check --status
          unzip -q "$archive" -d /opt
          test -x /opt/gradle-8.9/bin/gradle
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crashwoc-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
